project:
  type: website
  output-dir: docs

website:
  title: "Adam Hardaker"
  site-url: https://ahrdkr.com
  description: "Adam Hardaker — doctoral researcher working on knowledge production, research capacity, and metascience."
  navbar: false

extensions:
  - quarto-ext/fontawesome
  - mcanouil/iconify

page-footer:
  left: >-
     &#169; 2026 Adam Hardaker &#8729; Made with [Quarto](https://quarto.org)
  center: |
    <a class="footer-social" href="https://www.linkedin.com/in/michael-adam-hardaker/" aria-label="LinkedIn" target="_blank" rel="noopener">{{< iconify fa6-brands linkedin >}}</a>
    <a class="footer-social" href="https://substack.com/@ahardaker" aria-label="Substack" target="_blank" rel="noopener">{{< iconify simple-icons substack >}}</a>
    <a class="footer-social" href="https://orcid.org/0009-0008-1200-0127" aria-label="ORCID" target="_blank" rel="noopener">{{< iconify fa6-brands orcid >}}</a>
    <a class="footer-social" href="https://github.com/TalkToMeGoose" aria-label="GitHub" target="_blank" rel="noopener">{{< iconify fa6-brands github >}}</a>
    <a class="footer-social" href="mailto:adam.hardaker@uni-kassel.de" aria-label="Email">{{< fa envelope >}}</a>


format:
  html:
    theme:
      light: 
        - flatly
      dark:  
        - darkly
    color-mode:
      default: light
      toggle: true
      respect-system: false
    toc:     true
    css:     styles.css
    favicon: assets/favicon.svg
    page-layout: full
    include-before-body:
      - _includes/site-nav.html
